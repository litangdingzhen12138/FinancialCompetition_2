[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-text2sql"
version = "0.1.0"
description = "Rule-first, LLM-fallback Text2SQL service for the bank metrics competition dataset"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "sqlglot>=27.20,<28",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
include = ["text2sql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".deps"]
