name: bankinsight

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: ${BACKEND_ENV_FILE:-.env.production}
        required: false
    volumes:
      - ./deploy-data:/app/data
    restart: unless-stopped
    mem_limit: 1800m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from text2sql.config import Settings; import urllib.request; assert Settings.from_env().xlsx_path.is_file(); urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty means same-origin requests through Caddy, so the image is not
        # tied to localhost, a specific domain, or the host operating system.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BASE_URL:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    mem_limit: 900m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      # :80 accepts localhost, LAN IPs and server IPs. Setting a real domain
      # enables Caddy's automatic HTTPS without changing this file.
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
